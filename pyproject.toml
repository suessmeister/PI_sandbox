[project]
name = "multimodal-file-sandbox"
version = "0.1.0"
description = "An image prompt experiment wrapper around the Notion target service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=3,<4", "python-dotenv>=1,<2", "pydantic>=2,<3", "Pillow>=11,<13", "httpx>=0.28,<1"]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["experiment", "target", "judge", "generator", "models", "render", "reporting", "call_logging"]
